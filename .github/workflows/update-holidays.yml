name: Update Holiday News

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch RSS → JSON
        run: python scripts/fetch.py

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/nh0skkaj/holidaysvn.git
          git add data/holidays.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update holidays.json $(date -u +%Y-%m-%d)" && git push)
