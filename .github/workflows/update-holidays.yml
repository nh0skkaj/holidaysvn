name: Update Holiday News

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

            - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: holidays-json
          path: data/holidays.json
          retention-days: 90

      - name: Commit JSON to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holidays.json
          git diff --cached --quiet || git commit -m "Update holidays.json"
          git push
