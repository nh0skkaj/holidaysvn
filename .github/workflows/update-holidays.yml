name: Update Holiday News

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch RSS → JSON
        run: python scripts/fetch.py

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: holidays-json
          path: data/holidays.json
